services:
  postgres-primary:
    image: bitnamilegacy/postgresql:16
    container_name: scalable-postgres-primary
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: app_user
      POSTGRESQL_PASSWORD: app_password
      POSTGRESQL_DATABASE: products_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_primary_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d products_db"]
      interval: 10s
      timeout: 5s
      retries: 8

  postgres-replica:
    image: bitnamilegacy/postgresql:16
    container_name: scalable-postgres-replica
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: app_user
      POSTGRESQL_PASSWORD: app_password
      POSTGRESQL_DATABASE: products_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_replica_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d products_db"]
      interval: 10s
      timeout: 5s
      retries: 8

  api-node-a:
    build: ./api
    container_name: scalable-api-node-a
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    environment:
      NODE_ID: Node_A
      PORT: 3000
      WRITE_DATABASE_URL: postgres://app_user:app_password@postgres-primary:5432/products_db
      READ_DATABASE_URL: postgres://app_user:app_password@postgres-replica:5432/products_db
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  api-node-b:
    build: ./api
    container_name: scalable-api-node-b
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    environment:
      NODE_ID: Node_B
      PORT: 3000
      WRITE_DATABASE_URL: postgres://app_user:app_password@postgres-primary:5432/products_db
      READ_DATABASE_URL: postgres://app_user:app_password@postgres-replica:5432/products_db
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    image: nginx:1.27-alpine
    container_name: scalable-nginx
    depends_on:
      api-node-a:
        condition: service_healthy
      api-node-b:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_primary_data:
  postgres_replica_data:
